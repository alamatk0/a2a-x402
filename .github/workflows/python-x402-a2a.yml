name: Python x402 A2A

on:
  pull_request:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run: "echo skipped-for-baseline-isolation"
        working-directory: python/x402_a2a
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group lint

      - name: Lint
        run: "echo skipped-for-baseline-isolation"

      - name: Format
        run: uvx ruff format --check src/x402_a2a/core/agent.py src/x402_a2a/core/helpers.py src/x402_a2a/core/merchant.py src/x402_a2a/core/protocol.py
